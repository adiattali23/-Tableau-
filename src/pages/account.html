<!--
title: החשבון שלי | ORÉ
description: ההזמנות והפרטים שלך ב-ORÉ.
page: account
-->
  <main id="main" class="wrap page page--narrow">
    <header class="page-head">
      <h1>החשבון שלי</h1>
      <p>אם סימנת בקופה "לשמור את הפרטים", ההזמנות והפרטים שלך נשמרים כאן, רק במכשיר הזה.</p>
    </header>
    <div class="tabs" role="tablist" aria-label="החשבון שלי">
      <button role="tab" id="tab-orders" aria-controls="panel-orders" aria-selected="true" type="button">ההזמנות שלי</button>
      <button role="tab" id="tab-details" aria-controls="panel-details" aria-selected="false" tabindex="-1" type="button">הפרטים שלי</button>
    </div>
    <section role="tabpanel" id="panel-orders" aria-labelledby="tab-orders">
      <ul class="orders" id="orders-list"></ul>
    </section>
    <section role="tabpanel" id="panel-details" aria-labelledby="tab-details" hidden>
      <form id="details-form" class="details-form" novalidate>
        <div class="fields fields--2">
          <div class="field"><label for="d-name">שם מלא</label><input id="d-name" name="name" autocomplete="name"></div>
          <div class="field"><label for="d-phone">טלפון</label><input id="d-phone" name="phone" type="tel" autocomplete="tel" dir="ltr"></div>
          <div class="field field--wide"><label for="d-email">מייל</label><input id="d-email" name="email" type="email" autocomplete="email" dir="ltr"></div>
          <div class="field field--wide"><label for="d-street">רחוב ומספר בית</label><input id="d-street" name="street" autocomplete="address-line1"></div>
          <div class="field"><label for="d-city">עיר</label><input id="d-city" name="city" autocomplete="address-level2"></div>
          <div class="field"><label for="d-apt">דירה / קומה</label><input id="d-apt" name="apt" autocomplete="address-line2"></div>
        </div>
        <div class="form-actions">
          <button class="btn" type="submit">שמירת הפרטים</button>
          <button class="link-btn" type="button" id="details-clear">מחיקת הפרטים מהמכשיר</button>
        </div>
        <p class="form-status" id="details-status" role="status" aria-live="polite"></p>
      </form>
      <p class="note">הפרטים נשמרים רק בדפדפן הזה. כניסה עם סיסמה והזמנות מכל מכשיר יתווספו בהמשך.</p>
    </section>
  </main>
